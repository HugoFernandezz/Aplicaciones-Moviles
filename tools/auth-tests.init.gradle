// Uso explícito: -I tools/auth-tests.init.gradle [-PfocusedAndroidTests=phone]
// HomeModuleUiTest ya no compila en main por firmas antiguas de CatalogScreen y
// DetailScreen. Se excluye solo para poder compilar los tests de autenticación;
// no sustituye la compilación/verificación de la suite Android completa.
allprojects {
    afterEvaluate {
        def androidConfig = extensions.findByName('android')
        if (androidConfig != null) {
            def testPackage = providers.gradleProperty('focusedAndroidTests').getOrElse('auth')
            def packages = testPackage.split(',').toList()
            if (packages.any { !(it in ['auth', 'phone', 'profile']) }) throw new GradleException('Paquete de tests no válido')
            def testFolders = packages.collect { project.file("src/androidTest/java/com/example/gestorempresa/" + it) }
            androidConfig.sourceSets.getByName('androidTest').java.setSrcDirs(testFolders)
            extensions.findByName('kotlin')?.sourceSets?.findByName('androidTest')?.kotlin?.setSrcDirs(testFolders)
        }
    }
}
